name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela el run anterior: sin esto cada
# corrección durante una revisión pagaba minutos por un resultado que ya
# nadie iba a leer. (La cuota de Actions de la org llegó al 90% el 30-jul.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install pnpm before setup-node so `cache: pnpm` can find the store.
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `astro check` NO estaba en CI y `tsc` llevaba roto en local
      # (`ignoreDeprecations: "6.0"` con TS 5.9.3 aborta antes de comprobar
      # nada). Resultado: el `<Accordion type="single" collapsible>` que dejó
      # la migración a Base UI no lo cazó ningún check — sólo un typecheck a
      # mano. El build pasa igual porque el error es de tipos, no de runtime.
      - name: Typecheck
        run: pnpm run typecheck

      # The Studio contract gate: runs the SAME validator as the Hub Setup doctor
      # (@saastro/studio/doctor) — missing markers, i18n EN/ES parity, hardcoded
      # hex vs tokens, raw <form> vs HubForm, allowlist — then `astro build`.
      # Green here ⇒ green "Connect existing" in the Hub.
      - name: Studio check
        run: pnpm studio:check
