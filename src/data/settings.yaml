# Theme-only site config, read at build time by src/lib/settings.ts.
# NOTE: el Hub escribe algunas claves de este fichero (forms.siteId, gen.*,
# analytics.cloudflareWebAnalytics.token y el bloque `tracking`); el resto es la
# config de build del propio site (SEO, analytics, forms wiring). Editable content
# lives in i18n (src/i18n/translations/*), structural config in saastrocms.config.ts.

site:
  name: "TuMarca"
  # Google Search Console verification (leave empty to omit the meta tag).
  googleSiteVerificationId:
  favicon:
    colors:
      icon: "#00a897"
      theme: "#00a897"

metadata:
  # Fallback <meta description> when a page doesn't pass one. Per-page/per-locale
  # titles + descriptions come from the i18n `meta` namespace, not here.
  description: "Plantillas Astro rápidas con React + shadcn + Tailwind."

seo:
  # Site-wide JSON-LD (schema.org). A WebSite entity is always emitted; set
  # `schemaType` to also emit the primary entity for rich results.
  #   Person               -> personal site / portfolio (add jobTitle)
  #   Organization         -> company / product
  #   ProfessionalService  -> agency / studio
  # Leave empty to emit only the WebSite schema.
  schemaType: ""
  email: ""
  jobTitle: ""
  # Profiles / owned domains Google can cross-reference (one URL per line).
  sameAs: []

analytics:
  # Empty = disabled. GA/GTM are consent-gated; set a REAL id to enable.
  # Recommended for Saastro sites: use Cloudflare Web Analytics below instead.
  googleAnalytics:
    id: ""
  googleTagManager:
    id: ""
  cloudflareWebAnalytics:
    # CF Web Analytics beacon TOKEN (Hub → Audiencia gives you the site token).
    # This is the client-side beacon token — NOT the Hub's GraphQL "site tag".
    # Empty = disabled. Host-blocked in the Studio preview + local dev.
    token: ""

tracking:
  # Píxeles de medición y anuncios. Vacío = apagado. Todos esperan al consentimiento
  # del banner (analytics: GA4, Clarity · marketing: Google Ads, Meta, TikTok,
  # LinkedIn · GTM con cualquiera de las dos) y NINGUNO carga en una vista previa.
  # Encender uno añade un tratamiento: la política de cookies debe declararlo
  # (ancla <div data-legal="tracking-…"></div>, ver docs/legal-marketing.md) o
  # `pnpm studio:check` se pone rojo. Un id con formato inválido se descarta con
  # aviso en el build. Si ga4/gtm están aquí, ganan a analytics.googleAnalytics/…
  ga4: "G-B2MVN4RSSH" # G-XXXXXXXXXX
  gtm: "" # GTM-XXXXXXX
  googleAds: "" # AW-123456789
  googleAdsConversionLabel: "" # etiqueta de la conversión «lead» (solo con googleAds)
  metaPixel: "" # id numérico del Pixel
  tiktokPixel: "" # id del Pixel de TikTok
  linkedinPartnerId: "" # Partner ID del Insight Tag
  clarity: "z7a7k9iubl" # id del proyecto de Microsoft Clarity

forms:
  # Saastro Hub form integration. `siteId` is the Hub site this template is
  # connected to (Hub → Setup shows it; copied by hand today). Leave empty until
  # connected — the contact form then shows a "configure me" placeholder instead
  # of erroring. `contactFormSlug` is the form the slide-out ContactSheet renders.
  siteId: ""
  contactFormSlug: "contact"

gen:
  # SAASTRO Gen lead-attribution beacon (GenTracking): one cookieless page-view
  # per load → gen.saastro.io/collect, and the anonymous visitor id rides along
  # on form submits so Gen links each lead to its pre-conversion journey.
  # `workspaceId` = your Gen workspace (the Platform team id). EMPTY = OFF.
  # Toggled per site from Hub → Site → Settings, which writes this block
  # (same mechanism as forms.siteId). Host-blocked on previews/local dev.
  workspaceId: ""
  vertical: "default"
  # "none" = cookieless, tracks immediately (no banner needed).
  # "required" = waits until localStorage['gen-consent'] === 'granted'.
  consent: "none"

measure:
  # Medición render-vs-JS: cuántas visitas se quedan SIN formulario utilizable.
  # Tres contadores de primera parte (/mx/r.gif, /mx/j.gif, /mx/h.gif) — el
  # porqué de que sean tres y no dos está en src/lib/render-ratio.ts.
  # false = apagado del todo: ni pings en el HTML ni ruta /mx/*.gif (404).
  # Encenderlo añade un tratamiento de datos: copia antes la sección de
  # docs/legal-render-ratio.md a la política, o studio:check se pone rojo.
  renderRatio: false
  # "log" = una línea JSON por evento en los logs del Worker (no depende de
  # nadie). "gen" = además lo reenvía a Gen DESDE EL SERVIDOR, nunca desde el
  # navegador. Déjalo en "log" mientras el colector de Gen no acepte estos
  # eventos, o los estarás tirando contra una puerta cerrada.
  sink: "log"
  genEndpoint: "https://gen.saastro.io"
